<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-commerce Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header, nav {
      background-color: #333;
      color: white;
      padding: 10px;
      text-align: center;
    }
    nav button {
      margin: 0 5px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    section {
      display: none;
      padding: 20px;
    }
    section.active {
      display: block;
    }
    .product {
      border: 1px solid #ddd;
      margin: 10px;
      padding: 10px;
      display: inline-block;
      vertical-align: top;
      width: calc(50% - 40px);
      box-sizing: border-box;
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: contain;
    }
    .dark-mode {
      background-color: #121212;
      color: white;
    }
    .dark-mode .product {
      background-color: #1e1e1e;
      border-color: #555;
    }
    .offer {
      color: red;
      font-weight: bold;
    }
    #cartPopup {
      position: fixed;
      right: 20px;
      top: 60px;
      background: white;
      color: black;
      border: 1px solid #ccc;
      padding: 20px;
      z-index: 1000;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .dark-mode #cartPopup {
      background: #2c2c2c;
      color: white;
    }
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 16px;
      border-radius: 4px;
      z-index: 1001;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 1.5s;
    }
    @keyframes fadein {
      from {bottom: 0; opacity: 0;}
      to {bottom: 30px; opacity: 1;}
    }
    @keyframes fadeout {
      from {bottom: 30px; opacity: 1;}
      to {bottom: 0; opacity: 0;}
    }
  </style>
</head>

<body>
  <header>
    <h1>KK E-commerce Site</h1>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
  </header>

  <nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('products'); renderProducts(dataItems)">Products</button>
    <button onclick="showSection('about')">About</button>
    <button onclick="showSection('cart')">🛒 View Cart</button>
    <button onclick="showSection('products'); filterCategory('cases')">Cases</button>
    <button onclick="showSection('products'); filterCategory('mobiles')">Mobiles</button>
    <button onclick="showSection('products'); filterCategory('buds')">Buds</button>
  </nav>

  <section id="home" class="active">
    <h2>Welcome to our Mini E-commerce Store!</h2>
    <p>Find top gadgets, accessories, and more at unbeatable prices.</p>
    <div id="homeOffers"></div>
  </section>

  <section id="products">
    <input type="text" id="searchBar" placeholder="Search products...">
    <div id="productList"></div>
  </section>

  <section id="about">
    <h2>About Us</h2>
    <p>Contact: support@ministore.com | Phone: +91 1234567890</p>
  </section>

  <section id="cart">
    <h3>Your Cart</h3>
    <ul id="cartItems"></ul>
    <p>Total: ₹<span id="totalAmount">0</span></p>
  </section>

  <div id="toast" class="toast">Item added to cart!</div>

  <script>
    const dataItems = [
      { name: "Air Buds 3 Pro", price: 5999, desc: "Noise-cancelling wireless earbuds", img: "buds 3 pro.jpg", category: "buds", offer: "10% OFF" },
      { name: "Bass Buds 2R", price: 2999, desc: "Bass boosted earbuds", img: "buds 2r.jpg", category: "buds" },
      { name: "TWS Buds 3", price: 2999, desc: "Bass boosted earbuds", img: "buds 3.jpg", category: "buds" },
      { name: "Mobile 11", price: 19999, desc: "Flagship Android smartphone", img: "11.jpg", category: "mobiles", offer: "15% OFF" },
      { name: "Mobile 12", price: 18999, desc: "Compact mobile with high performance", img: "12.jpg", category: "mobiles" },
      { name: "Mobile 13", price: 18999, desc: "Compact mobile with high performance", img: "13.jpg", category: "mobiles" },
      { name: "Mobile 13s", price: 18999, desc: "Compact mobile with high performance", img: "13s.jpg", category: "mobiles" },
      { name: "Tab 2", price: 14999, desc: "Full HD Android tablet", img: "pad 2.jpg", category: "tabs" },
      { name: "Tab 8", price: 14999, desc: "Full HD Android tablet", img: "pad 8.jpg", category: "tabs" },
      { name: "Case 12", price: 499, desc: "Durable phone case", img: "12 c.jpg", category: "cases" },
      { name: "Case 13", price: 499, desc: "Durable phone case", img: "13c.jpg", category: "cases" },
      { name: "Case 13s", price: 499, desc: "Durable phone case", img: "13s c.jpg", category: "cases" },
    ];

    const cart = [];

    function renderProducts(items) {
      const container = document.getElementById('productList');
      container.innerHTML = '';
      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <h4>${item.name}</h4>
          <p>${item.desc}</p>
          <p>₹${item.price} ${item.offer ? `<span class="offer">(${item.offer})</span>` : ''}</p>
          <button onclick="addToCart(${index})">Add to Cart</button>
        `;
        container.appendChild(div);
      });
    }

    function addToCart(index) {
      cart.push(dataItems[index]);
      showToast();
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cartItems');
      const totalAmount = document.getElementById('totalAmount');
      cartItems.innerHTML = '';
      let total = 0;
      cart.forEach((item, i) => {
        total += item.price;
        const li = document.createElement('li');
        li.innerHTML = `<img src="${item.img}" style="width:40px;height:40px;vertical-align:middle;margin-right:10px;">${item.name} - ₹${item.price}`;
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '❌';
        removeBtn.onclick = () => { cart.splice(i, 1); updateCart(); };
        li.appendChild(removeBtn);
        cartItems.appendChild(li);
      });
      totalAmount.textContent = total;
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function showSection(id) {
      document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const searchBar = document.getElementById('searchBar');
      if (searchBar) {
        searchBar.addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase();
          const filtered = dataItems.filter(item =>
            item.name.toLowerCase().includes(term) ||
            item.category.toLowerCase().includes(term) ||
            item.desc.toLowerCase().includes(term)
          );
          renderProducts(filtered);
        });
      }
      renderProducts(dataItems);
      loadHomeOffers();
    });

    function filterCategory(category) {
      const filtered = dataItems.filter(item => item.category === category);
      renderProducts(filtered);
    }

    function loadHomeOffers() {
      const homeOffers = document.getElementById('homeOffers');
      homeOffers.innerHTML = '';
      const offers = dataItems.filter(item => item.offer).slice(0, 2);
      offers.forEach(item => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <h4>${item.name}</h4>
          <p>₹${item.price} <span class="offer">(${item.offer})</span></p>
        `;
        homeOffers.appendChild(div);
      });
    }
  </script>
</body>

</html>
