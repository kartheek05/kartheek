<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e0f2f1;
    }

    header {
      background-color: #00796b;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin: 0 12px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 2rem;
      margin: 20px;
      border: 2px solid #80cbc4;
      border-radius: 10px;
      background-color: #ffffff;
    }

    h2 {
      color: #004d40;
    }

    p {
      font-size: 1rem;
      color: #333;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
    }

    ul li {
      margin: 10px 0;
    }

    ul li a {
      text-decoration: none;
      color: #00796b;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    ul li a:hover {
      color: #004d40;
    }

    form input,
    form textarea {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #004d40;
      border-radius: 5px;
      font-size: 1rem;
      background-color: #f1fdfc;
    }

    button {
      padding: 10px 20px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <p>Hello! I'm a web developer passionate about building modern web apps.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <ul>
      <li><a href="Task4 todo.html" target="_blank">To-Do App</a></li>
      <li><a href="task4lisi.html" target="_blank">Product Listing Page</a></li>
    </ul>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form onsubmit="handleSubmit(event)">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      alert('Thank you! Your contact details have been received.');
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('message').value = '';
    }
  </script>
</body>
</html>
